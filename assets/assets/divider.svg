<svg width="1000" height="26" viewBox="0 0 1000 26" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e9d5ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lineClip">
      <rect x="0" y="12" width="1000" height="2"/>
    </clipPath>
  </defs>

  <rect x="0" y="12" width="1000" height="2" fill="url(#lineGrad)"/>

  <g clip-path="url(#lineClip)">
    <rect x="-220" y="10" width="220" height="6" fill="url(#sweepGrad)">
      <animate attributeName="x" values="-220;1000" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="500" cy="13" r="3.5" fill="#22d3ee">
    <animate attributeName="r" values="2.5;4.5;2.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="13" r="2" fill="#a855f7" opacity="0.7"/>
  <circle cx="980" cy="13" r="2" fill="#a855f7" opacity="0.7"/>
</svg>
