<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#241b4e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <clipPath id="figureClip">
      <path d="M760 62 Q788 62 792 96 Q796 128 776 148 L776 168 Q824 178 832 224 Q838 256 824 268 Q760 288 696 268 Q682 256 688 224 Q696 178 744 168 L744 148 Q724 128 728 96 Q732 62 760 62 Z"/>
    </clipPath>
    <clipPath id="roundedBanner">
      <rect x="0" y="0" width="1000" height="360" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedBanner)">
    <rect x="0" y="0" width="1000" height="360" fill="url(#bgGrad)"/>

    <!-- faint grid backdrop -->
    <g stroke="#a855f7" stroke-opacity="0.08">
      <line x1="0" y1="60" x2="1000" y2="60"/>
      <line x1="0" y1="120" x2="1000" y2="120"/>
      <line x1="0" y1="240" x2="1000" y2="240"/>
      <line x1="0" y1="300" x2="1000" y2="300"/>
    </g>

    <!-- ================= LEFT: identity block ================= -->
    <text x="46" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#nameGrad)">
      Tanisha Sinha
      <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0s" fill="freeze"/>
    </text>

    <!-- typewriter tagline -->
    <clipPath id="typeClip">
      <rect x="46" y="140" width="0" height="34">
        <animate attributeName="width" from="0" to="640" dur="2.6s" begin="1s" fill="freeze"/>
      </rect>
    </clipPath>
    <text x="46" y="166" font-family="Fira Code, Consolas, monospace" font-size="19" fill="#c9d1d9" clip-path="url(#typeClip)">
      &gt; Building intelligent systems at the intersection of AI &amp; software.
    </text>
    <rect x="686" y="146" width="10" height="24" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="0.9s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0" dur="3.6s" begin="0s" fill="freeze"/>
    </rect>

    <!-- role badges, staggered fade-in -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <g>
        <rect x="46" y="196" width="130" height="30" rx="15" fill="none" stroke="#a855f7" stroke-opacity="0.7"/>
        <text x="61" y="216" fill="#e5d9ff">AI &amp; DATA SCIENCE</text>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;1" dur="1s" begin="4.2s" fill="freeze"/>
      </g>
      <g>
        <rect x="188" y="196" width="76" height="30" rx="15" fill="none" stroke="#22d3ee" stroke-opacity="0.7"/>
        <text x="203" y="216" fill="#c9f5ff">NLP</text>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;1" dur="1s" begin="4.5s" fill="freeze"/>
      </g>
      <g>
        <rect x="276" y="196" width="150" height="30" rx="15" fill="none" stroke="#a855f7" stroke-opacity="0.7"/>
        <text x="291" y="216" fill="#e5d9ff">GENERATIVE AI</text>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;1" dur="1s" begin="4.8s" fill="freeze"/>
      </g>
      <g>
        <rect x="46" y="238" width="176" height="30" rx="15" fill="none" stroke="#22d3ee" stroke-opacity="0.7"/>
        <text x="61" y="258" fill="#c9f5ff">SOFTWARE ENGINEERING</text>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;1" dur="1s" begin="5.1s" fill="freeze"/>
      </g>
      <g>
        <rect x="234" y="238" width="90" height="30" rx="15" fill="none" stroke="#a855f7" stroke-opacity="0.7"/>
        <text x="249" y="258" fill="#e5d9ff">DSA</text>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;1" dur="1s" begin="5.4s" fill="freeze"/>
      </g>
    </g>

    <text x="46" y="322" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#8b8fa3">B.Tech — Artificial Intelligence &amp; Data Science · BML Munjal University</text>

    <!-- ================= RIGHT: AI hologram avatar ================= -->
    <g transform="translate(760,180)">
      <circle r="150" fill="url(#auraGrad)">
        <animate attributeName="r" values="140;155;140" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- radar rings -->
      <circle r="132" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle r="112" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="19s" repeatCount="indefinite"/>
      </circle>

      <!-- corner HUD brackets -->
      <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.8">
        <path d="M-95 -95 L-95 -75 M-95 -95 L-75 -95"/>
        <path d="M95 -95 L95 -75 M95 -95 L75 -95"/>
        <path d="M-95 95 L-95 75 M-95 95 L-75 95"/>
        <path d="M95 95 L95 75 M95 95 L75 95"/>
      </g>

      <!-- orbiting particles (plain glyphs so nothing rotates upside-down) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
        <circle cx="140" cy="0" r="5" fill="#22d3ee">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="27s" repeatCount="indefinite"/>
        <circle cx="140" cy="0" r="6" fill="#a855f7">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="240" to="-120" dur="31s" repeatCount="indefinite"/>
        <circle cx="140" cy="0" r="4" fill="#e9d5ff">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- fixed, upright, pulsing tags around the avatar -->
      <g font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="600">
        <text x="-176" y="-72" fill="#22d3ee">&lt;/&gt;</text>
        <text x="150" y="-60" fill="#a855f7">AI</text>
        <text x="-182" y="70" fill="#22d3ee">NLP</text>
        <text x="150" y="86" fill="#e9d5ff">{ }</text>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
      </g>

      <!-- avatar silhouette, hologram style -->
      <path transform="translate(-760,-180)" d="M760 62 Q788 62 792 96 Q796 128 776 148 L776 168 Q824 178 832 224 Q838 256 824 268 Q760 288 696 268 Q682 256 688 224 Q696 178 744 168 L744 148 Q724 128 728 96 Q732 62 760 62 Z" fill="url(#figureGrad)" fill-opacity="0.85"/>
      <path transform="translate(-760,-180)" d="M718 66 Q676 78 672 128 Q668 158 690 176 Q668 150 674 108 Q680 74 718 66 Z" fill="url(#hairGrad)" fill-opacity="0.9"/>

      <!-- circuit overlay clipped to silhouette -->
      <g transform="translate(-760,-180)" clip-path="url(#figureClip)" stroke="#e9d5ff" stroke-width="1" opacity="0.55">
        <path d="M700 100 H760 V140 H820" fill="none">
          <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" repeatCount="indefinite"/>
        </path>
        <path d="M720 200 H800 V240" fill="none">
          <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.1s" repeatCount="indefinite"/>
        </path>
        <circle cx="760" cy="140" r="3" fill="#22d3ee"/>
        <circle cx="800" cy="240" r="3" fill="#a855f7"/>
        <!-- scan line -->
        <rect x="670" y="60" width="180" height="6" fill="#e9d5ff" opacity="0.5">
          <animate attributeName="y" values="60;280;60" dur="3.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
